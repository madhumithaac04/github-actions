name: Hello World Workflow
on: 
  workflow_dispatch:
jobs:
  say-hello-inline-bash:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello, World!"
      - name: variable
        run: echo ${{github.ref}}
  need-1:
     needs: say-hello-inline-bash
     runs-on: ubuntu-latest
     steps:
       - name: print need 1
         run: echo "need one"
  need-2:
     needs: [say-hello-inline-bash,need-1]
     runs-on: ubuntu-latest
     steps:
       - name: print need 2
         run: echo "need two"
         
