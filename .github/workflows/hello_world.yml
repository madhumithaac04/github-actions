name: Hello World Workflow
on: 
  workflow_dispatch:
env:
  NAME: madhumitha-workflow
jobs:
  say-hello-inline-bash:
    runs-on: ubuntu-latest
    env:
      JOB_LEVEL: I am from job level
    steps:
      - name: Say Hello
        run: echo "Hello, World!"
      - name: variable
        run: echo ${{github.ref}}
      - name: custom variable
        run: echo ${{env.NAME}}
      - name: job_level
        run: echo ${{env.JOB_LEVEL}}
      - name: step_level
        env:
           STEP_LEVEL: I am from step level
        run: echo ${{env.STEP_LEVEL}}
        
        
